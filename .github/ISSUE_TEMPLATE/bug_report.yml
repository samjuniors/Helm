name: Bug report
description: Report a reproducible Helm problem (do not include secrets)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Helm. Please remove tokens, personal data, and private project content.
        Security vulnerabilities should be reported privately as explained in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the actual problem and impact.
      placeholder: Helm returned... when I tried to...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe example.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Helm version
      placeholder: v0.4.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and AI host/IDE if relevant
      placeholder: Windows 11, Node 22, Codex CLI ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Omit credentials, local account names, access tokens, and private project files.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
